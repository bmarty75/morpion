# Configuration SonarQube Cloud (ex-SonarCloud).
#
# Ces deux cles doivent correspondre a celles affichees par SonarQube Cloud
# (projet > Information > Project Key / Organization Key).
sonar.projectKey=bmarty75_morpion
sonar.organization=bmarty75

sonar.projectName=Morpion
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Tout le depot est analyse, sauf les artefacts generes.
# Les fichiers de test sont declares a part : Sonar ne leur applique pas les
# memes regles qu'au code de production (une assertion dupliquee, par exemple,
# n'est pas un defaut).
sonar.sources=.
sonar.exclusions=coverage/**,node_modules/**,_site/**,**/*.test.js

sonar.tests=.
sonar.test.inclusions=**/*.test.js

# Couverture produite par `npm run test:lcov` (reporter lcov integre a Node).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
